# ============================================================
# TABLA: DUDAS_PENDIENTES
# Preguntas de diseño abiertas sobre Recepción CKD / BOM / Kitting.
# Se completan progresivamente en la columna RESPUESTA; cada
# respuesta puede implicar ajustar BOM_REF, RECEPCIONES_CKD,
# ORDENES_PRODUCCION o los Bots de expresiones/ckd_bots.yaml.
# ============================================================

columns:

  - name: ID
    type: Number
    key: true
    label: false

  - name: CATEGORIA
    type: Enum
    enum_values:
      - "BOM / Piezas críticas"
      - "Recepción CKD"
      - "Orden de Producción"
      - "Depósito / Ubicación"
      - "Trazabilidad y calidad"
      - "OEE / paradas de línea"
      - "Escala / performance"
      - "Catálogo de Productos"

  - name: PREGUNTA
    type: LongText

  - name: POR_QUE_IMPORTA
    type: LongText
    description: "Qué parte del diseño cambia según la respuesta"

  - name: ESTADO
    type: Enum
    enum_values:
      - ABIERTA
      - PARCIAL
      - RESPONDIDA
    initial_value: "ABIERTA"

  - name: RESPUESTA
    type: LongText
    editable: true
    description: "Completar acá — ir cerrando de a una"

data:
  - ID: 1
    CATEGORIA: "BOM / Piezas críticas"
    PREGUNTA: >
      ¿Qué se considera "pieza crítica"? ¿Lo definís vos material por
      material, o hay ya un criterio/checklist de calidad de la empresa?
    POR_QUE_IMPORTA: "Define cómo se completa la columna CRITICO en BOM_REF."
    ESTADO: "RESPONDIDA"
    RESPUESTA: >
      "Todo lo que si falta no se puede armar la moto" — es decir,
      CRITICO = TRUE para cualquier material obligatorio para el
      armado (prácticamente todo lo estructural/funcional); CRITICO =
      FALSE solo para lo opcional/no bloqueante (ej. accesorios,
      cosmética). Con este criterio, la mayoría de las líneas de
      BOM_REF probablemente deberían quedar en CRITICO=TRUE.

  - ID: 2
    CATEGORIA: "BOM / Piezas críticas"
    PREGUNTA: >
      ¿Cuántas piezas distintas lleva realmente un modelo, dentro de
      cada categoría confirmada (plásticos, motores, partes de
      chasis, ventiladores CKD)? Ej: "plásticos" seguramente son
      varias piezas (carenados, guardabarros, tapas...), no una sola.
    POR_QUE_IMPORTA: "BOM_REF hoy tiene solo 1 SKU de ejemplo por categoría. Falta el detalle real (probablemente 15-30+ ítems por modelo) antes de usarlo en producción."
    ESTADO: "PARCIAL"
    RESPUESTA: >
      PARCIAL: se confirmaron las 4 categorías (plásticos, motores,
      partes de chasis, ventiladores CKD) para motos CKD, 3 modelos.
      Falta el detalle: SKUs, cantidades y cuáles piezas son críticas
      dentro de cada categoría.

  - ID: 3
    CATEGORIA: "Recepción CKD"
    PREGUNTA: >
      El código de contenedor (LOTE), ¿lo asigna el proveedor en el
      remito/ASN, o lo generan ustedes al recibirlo?
    POR_QUE_IMPORTA: "Define si LOTE sigue siendo texto libre escaneable o necesita un generador correlativo propio."
    ESTADO: "RESPONDIDA"
    RESPUESTA: >
      Lo asigna el proveedor en el remito. Confirma el diseño actual:
      LOTE queda como texto libre escaneable (RECEPCIONES_CKD.LOTE,
      scan=true), sin necesidad de un generador correlativo propio.

  - ID: 4
    CATEGORIA: "Recepción CKD"
    PREGUNTA: >
      ¿Un contenedor siempre trae piezas para UN solo modelo, o vienen
      varios modelos mezclados en el mismo contenedor?
    POR_QUE_IMPORTA: "Si es mixto, RECEPCIONES_CKD.COD_MOD (un solo modelo por recepción) no alcanza y hay que rediseñar a nivel de líneas por modelo dentro de la misma recepción."
    ESTADO: "RESPONDIDA"
    RESPUESTA: >
      Un solo modelo por contenedor. Confirma el diseño actual:
      RECEPCIONES_CKD.COD_MOD (un modelo por recepción) alcanza,
      sin necesidad de rediseñar a nivel de líneas por modelo.

  - ID: 5
    CATEGORIA: "Recepción CKD"
    PREGUNTA: >
      Cuando el QC detecta faltantes críticos, ¿qué pasa en la
      práctica? ¿Se rechaza todo el contenedor, se acepta con una
      nota, se abre un reclamo al proveedor?
    POR_QUE_IMPORTA: "Define si hace falta un estado adicional en ESTADO_QC (ej. RECHAZADO) y una vista/acción para generar el reclamo."
    ESTADO: "RESPONDIDA"
    RESPUESTA: >
      Se abre un reclamo al proveedor (no se rechaza el contenedor).
      Implementado: RECEPCIONES_CKD suma RECLAMO_ABIERTO, FECHA_RECLAMO,
      OBS_RECLAMO y la columna virtual REQUIERE_RECLAMO (faltantes
      críticos + reclamo todavía no abierto). Nueva vista/slice
      "Recepciones_Requieren_Reclamo" y KPI en el Dashboard CKD. La
      resolución (proveedor repone) se sigue registrando como
      movimiento COMPLETO en Deposito con el mismo LOTE.

  - ID: 6
    CATEGORIA: "Orden de Producción"
    PREGUNTA: >
      Hoy, ¿cómo se genera la Orden de Producción (OP)? ¿Manual en
      papel/Excel, o ya existe en algún sistema?
    POR_QUE_IMPORTA: "Define si COD_OP se sigue cargando a mano en ORDENES_PRODUCCION o conviene importarlo desde otro lado."
    ESTADO: "RESPONDIDA"
    RESPUESTA: >
      No existe todavía — ni sistema ni proceso en papel/Excel.
      Confirma el diseño actual: ORDENES_PRODUCCION es el lugar
      donde nace la OP (form manual, COD_OP a mano), no hay nada que
      importar de otro lado.

  - ID: 7
    CATEGORIA: "Orden de Producción"
    PREGUNTA: >
      ¿Cuántas líneas de ensamble simultáneas hay en la planta?
    POR_QUE_IMPORTA: "Si hay más de una línea, PICKING_OP necesitaría un campo LINEA_DESTINO para que el operario sepa a qué línea llevar cada kit."
    ESTADO: "RESPONDIDA"
    RESPUESTA: >
      1 sola línea por ahora. Confirma el diseño actual: no hace
      falta LINEA_DESTINO en PICKING_OP. Si en el futuro se suma una
      segunda línea, ahí sí agregar el campo.

  - ID: 8
    CATEGORIA: "Depósito / Ubicación"
    PREGUNTA: >
      La ubicación en estantería (UBICACION en MATERIALES_REF),
      ¿es fija por material o rota según espacio disponible?
    POR_QUE_IMPORTA: "Si rota, un campo de texto fijo no alcanza — habría que trackear la ubicación como parte de cada movimiento en Deposito, no como un dato fijo del material."
    ESTADO: "RESPONDIDA"
    RESPUESTA: >
      Rotativa: "en rack que no son fijos, es decir según se liberan se
      va ocupando". Implementado: se sacó MATERIALES_REF.UBICACION
      (fijo) y se agregó Deposito.UBICACION (por movimiento de ENTRADA,
      validado contra la nueva tabla UBICACIONES) + MATERIALES_REF.
      ULTIMA_UBICACION (orientativa, la más reciente conocida).

  - ID: 9
    CATEGORIA: "Depósito / Ubicación"
    PREGUNTA: >
      ¿Quién arma el kit físicamente hoy? ¿Un operario con lista
      impresa, con tablet, o hay algún tipo de cinta/transporte
      automático?
    POR_QUE_IMPORTA: "Confirma si la vista 'Picking a Línea' en un celular/tablet alcanza, o si hace falta otra interfaz (ej. pantalla fija en el depósito)."
    ESTADO: "RESPONDIDA"
    RESPUESTA: >
      4 operarios, sin ninguna herramienta hoy (ni lista impresa ni
      tablet — a memoria/criterio propio). Confirma que la vista
      "Picking a Línea" en celular/tablet es una mejora real, no un
      reemplazo de algo que ya funcionaba. Pendiente operativo (no
      de diseño): dar de alta 4 cuentas de operario en AppSheets con
      acceso a esa vista.

  - ID: 10
    CATEGORIA: "Trazabilidad y calidad"
    PREGUNTA: >
      El material de referencia menciona trazabilidad de "qué operario
      y qué herramienta ajustó cada pieza" — un nivel de detalle mucho
      más fino que lo que hoy registra Producción (que solo guarda la
      moto terminada, no cada pieza individual).
    POR_QUE_IMPORTA: "¿Vale la pena ese nivel de detalle, o alcanza con saber qué operario cargó cada movimiento de depósito (columna RESPONSABLE, que ya existe)? Ese nivel de detalle implicaría una tabla nueva mucho más granular."
    ESTADO: "RESPONDIDA"
    RESPUESTA: >
      Alcanza con RESPONSABLE por movimiento. Confirma el diseño
      actual: no hace falta una tabla de trazabilidad pieza por pieza
      con operario+herramienta. Descartado por ahora.

  - ID: 11
    CATEGORIA: "OEE / paradas de línea"
    PREGUNTA: >
      Para las métricas OEE (tiempos de parada, cuellos de botella)
      que menciona el material de referencia: ¿hoy miden tiempos de
      parada de alguna forma (manual, cronómetro, otro sistema)?
    POR_QUE_IMPORTA: "Google Sheets/AppSheets no sirve para captura en tiempo real de eventos de máquina. Si esto se necesita de verdad, probablemente requiera otra herramienta o un módulo aparte — no está incluido en este diseño."
    ESTADO: "RESPONDIDA"
    RESPUESTA: >
      No, no miden nada de eso todavía. Confirma que OEE queda FUERA
      de alcance de este sistema por ahora — no se implementa nada
      relacionado. Si en el futuro empiezan a medir paradas de alguna
      forma manual simple, se puede evaluar agregar algo liviano;
      captura en tiempo real seguiría necesitando otra herramienta.

  - ID: 12
    CATEGORIA: "Escala / performance"
    PREGUNTA: >
      Con 20-100 motos/día, la tabla Deposito puede acumular miles de
      filas al año, y las fórmulas SUM(SELECT(...)) se ponen lentas en
      Google Sheets a partir de cierto volumen.
    POR_QUE_IMPORTA: "¿Está bien archivar (mover a una hoja histórica) los movimientos de más de N meses, o necesitan todo el historial siempre 'vivo' para consultas? Define si hace falta un proceso de archivado periódico."
    ESTADO: "ABIERTA"

  - ID: 13
    CATEGORIA: "Catálogo de Productos"
    PREGUNTA: >
      Confirmado: son 3 modelos de moto CKD (no 6). ¿Cuáles son los
      3 modelos reales — nombres, cilindrada, y el prefijo de chasis
      o código que los identifica? MODELOS_REF y BOM_REF hoy siguen
      teniendo los 6 modelos de EJEMPLO originales del repo (Cub 110,
      Urban 110, VX125, Super Sport 200, Rally 250, Faiter SE 150),
      que nunca fueron confirmados como reales.
    POR_QUE_IMPORTA: "Hay que reemplazar MODELOS_REF y BOM_REF por los 3 modelos reales — todo lo que referencia COD_MOD (Producción, Depósito, CKD) depende de esto."
    ESTADO: "ABIERTA"

  - ID: 14
    CATEGORIA: "Catálogo de Productos"
    PREGUNTA: >
      Bicicletas (~24 modelos): ¿comparten el mismo depósito/materiales
      físicos que las motos (mismo galpón, mismos racks rotativos), o
      es una zona/inventario separado? ¿Las bicicletas también llegan
      como CKD (desarmadas, con BOM y recepción/QC), o se arman/compran
      distinto?
    POR_QUE_IMPORTA: >
      Define la arquitectura: (a) un único catálogo de productos
      (MODELOS_REF unificado con un campo TIPO_PRODUCTO=MOTO/BICICLETA)
      compartiendo Deposito/MATERIALES_REF/BOM_REF, o (b) un sistema
      paralelo tipo BICICLETAS_REF + BOM_BICICLETAS + su propio
      Deposito. Es la decisión de mayor impacto pendiente.
    ESTADO: "ABIERTA"

  - ID: 15
    CATEGORIA: "Catálogo de Productos"
    PREGUNTA: >
      Para las bicicletas, ¿querés que arme ya la estructura de tablas
      con un par de modelos de ejemplo (como se hizo con motos), o
      preferís esperar a tener la lista real de los ~24 modelos antes
      de tocar código?
    POR_QUE_IMPORTA: "Evita fabricar 24 modelos y sus BOM inventados de la nada — mejor confirmar alcance antes de generar datos de ejemplo que después haya que descartar."
    ESTADO: "ABIERTA"
