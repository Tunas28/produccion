# ============================================================
# TABLA: PRODUCCION
# AppSheets - Definición completa de columnas
# ============================================================

columns:

  # ──────────────────────────────────────────────────────────
  # COLUMNAS DE REGISTRO (ingreso manual o automático)
  # ──────────────────────────────────────────────────────────

  - name: FECHA
    type: Date
    key: false
    label: false
    editable: true
    required: true
    show: true
    initial_value: "TODAY()"
    search: false

  - name: ID
    type: Number
    key: false
    label: false
    editable: false
    required: false
    show: true
    formula: "MAXROW(\"Produccion\", \"ID\") + 1"

  - name: CHASIS
    type: Text
    key: true
    label: true
    editable: true
    required: true
    show: true
    scan: true          # ← Activa escáner QR con la cámara del celular
    search: true
    valid_if: >
      AND(
        STARTS_WITH(UPPER(TRIM([CHASIS])), "PPA"),
        LEN(TRIM([CHASIS])) >= 15,
        NOT(IN([CHASIS], SELECT(Produccion[CHASIS], [_THISROW_BEFORE] <> [_THISROW])))
      )
    valid_if_error: "Chasis inválido o duplicado. Verificar formato (mínimo 15 caracteres, debe comenzar con PPA)."

  - name: NUM. MOTOR
    type: Text
    key: false
    label: false
    editable: true
    required: true
    show: true
    search: true
    valid_if: >
      AND(
        LEN(TRIM([NUM. MOTOR])) > 0,
        NOT(IN([NUM. MOTOR], SELECT(Produccion[NUM. MOTOR], [_THISROW_BEFORE] <> [_THISROW]))),
        OR(LEN([COD MOTOR]) = 0, STARTS_WITH(UPPER(TRIM([NUM. MOTOR])), UPPER([COD MOTOR])))
      )
    valid_if_error: "Número de motor duplicado o no corresponde al modelo escaneado."

  - name: COLOR
    type: Enum
    key: false
    label: false
    editable: true
    required: true
    show: true
    enum_values:
      - NEGRO
      - AZUL
      - GRIS
      - ROJO
      - NARANJA
      - BLANCO

  - name: OBS
    type: LongText
    key: false
    label: false
    editable: true
    required: false
    show: true

  # ──────────────────────────────────────────────────────────
  # COLUMNAS AUTO-CALCULADAS desde el prefijo del CHASIS
  # editable: false — el usuario NO las toca
  # ──────────────────────────────────────────────────────────

  - name: MODELO
    type: Text
    key: false
    label: false
    editable: false
    required: false
    show: true
    formula: >
      IFS(
        LEFT([CHASIS], 5) = "PPA1A", "Cub 110",
        LEFT([CHASIS], 5) = "PPABA", "Urban 110",
        LEFT([CHASIS], 5) = "PPA2B", "VX125",
        LEFT([CHASIS], 5) = "PPAAD", "Super Sport 200",
        LEFT([CHASIS], 5) = "PPAEE", "Rally 250",
        LEFT([CHASIS], 5) = "PPAGC", "Faiter SE 150",
        TRUE, "DESCONOCIDO"
      )

  - name: CILINDRADA
    type: Number
    key: false
    label: false
    editable: false
    required: false
    show: true
    formula: >
      IFS(
        LEFT([CHASIS], 5) = "PPA1A", 110,
        LEFT([CHASIS], 5) = "PPABA", 110,
        LEFT([CHASIS], 5) = "PPA2B", 125,
        LEFT([CHASIS], 5) = "PPAAD", 200,
        LEFT([CHASIS], 5) = "PPAEE", 250,
        LEFT([CHASIS], 5) = "PPAGC", 150,
        TRUE, 0
      )

  - name: RUEDA
    type: Text
    key: false
    label: false
    editable: false
    required: false
    show: true
    formula: >
      IFS(
        LEFT([CHASIS], 5) = "PPA1A", "ALEACION",
        LEFT([CHASIS], 5) = "PPABA", "RAYOS",
        LEFT([CHASIS], 5) = "PPA2B", "ALEACION",
        LEFT([CHASIS], 5) = "PPAAD", "ALEACION",
        LEFT([CHASIS], 5) = "PPAEE", "RAYOS",
        LEFT([CHASIS], 5) = "PPAGC", "ALEACION",
        TRUE, ""
      )

  - name: COD MOD
    type: Text
    key: false
    label: false
    editable: false
    required: false
    show: true
    formula: >
      IFS(
        LEFT([CHASIS], 5) = "PPA1A", "1A",
        LEFT([CHASIS], 5) = "PPABA", "BA",
        LEFT([CHASIS], 5) = "PPA2B", "2B",
        LEFT([CHASIS], 5) = "PPAAD", "AD",
        LEFT([CHASIS], 5) = "PPAEE", "EE",
        LEFT([CHASIS], 5) = "PPAGC", "GC",
        TRUE, ""
      )

  - name: COD MOTOR
    type: Text
    key: false
    label: false
    editable: false
    required: false
    show: true
    formula: >
      IFS(
        LEFT([CHASIS], 5) = "PPA1A", "1P52FMH",
        LEFT([CHASIS], 5) = "PPABA", "1P52FMH",
        LEFT([CHASIS], 5) = "PPA2B", "1P53FMI",
        LEFT([CHASIS], 5) = "PPAAD", "163FML",
        LEFT([CHASIS], 5) = "PPAEE", "165FMM",
        LEFT([CHASIS], 5) = "PPAGC", "162FMJ",
        TRUE, ""
      )

  # ──────────────────────────────────────────────────────────
  # COLUMNAS VIRTUALES para KPIs y Gráficos
  # Estas columnas NO se guardan en la hoja, son solo para filtros y reportes
  # ──────────────────────────────────────────────────────────

  - name: SEMANA
    type: Number
    key: false
    label: false
    editable: false
    show: false
    formula: "WEEKNUM([FECHA])"
    description: "Número de semana del año - usado para KPIs semanales"

  - name: MES
    type: Number
    key: false
    label: false
    editable: false
    show: false
    formula: "MONTH([FECHA])"
    description: "Número de mes - usado para KPIs mensuales"

  - name: AÑO
    type: Number
    key: false
    label: false
    editable: false
    show: false
    formula: "YEAR([FECHA])"
    description: "Año - evita confusión entre semanas de distintos años"

  - name: MES_LABEL
    type: Text
    key: false
    label: false
    editable: false
    show: false
    formula: "TEXT([FECHA], \"MMM YYYY\")"
    description: "Ej: Mar 2026 - para agrupar gráficos mensuales"

  - name: ES_HOY
    type: Yes/No
    key: false
    label: false
    editable: false
    show: false
    formula: "[FECHA] = TODAY()"
    description: "Verdadero si el registro es de hoy - para KPI diario"

  - name: ES_ESTA_SEMANA
    type: Yes/No
    key: false
    label: false
    editable: false
    show: false
    formula: >
      AND(
        WEEKNUM([FECHA]) = WEEKNUM(TODAY()),
        YEAR([FECHA]) = YEAR(TODAY())
      )
    description: "Verdadero si el registro es de esta semana"

  - name: ES_ESTE_MES
    type: Yes/No
    key: false
    label: false
    editable: false
    show: false
    formula: >
      AND(
        MONTH([FECHA]) = MONTH(TODAY()),
        YEAR([FECHA]) = YEAR(TODAY())
      )
    description: "Verdadero si el registro es de este mes"
