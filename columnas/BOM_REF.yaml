# ============================================================
# TABLA DE REFERENCIA: BOM_REF (Bill of Materials)
# Qué materiales y en qué cantidad lleva CADA MODELO de moto.
# Es la pieza que faltaba para: validar kits CKD al recibir el
# contenedor, y para armar el picking (kitting) hacia la línea.
# Esta tabla NO se edita desde la app (solo lectura, mantenimiento manual)
# ============================================================

# Columnas de la hoja BOM_REF en Google Sheets:
#   ID_BOM | COD_MOD | COD_MATERIAL | CANTIDAD_POR_UNIDAD | CRITICO
#   -------|---------|--------------|----------------------|--------
#   1A-CH01 | 1A     | CH01         | 1                     | TRUE
#   1A-MT01 | 1A     | MT01         | 1                     | TRUE
#   ...
#
# ⚠ BOM de EJEMPLO — completar con la lista real de materiales
#   por modelo (hoy solo tiene 2-3 piezas de muestra por modelo,
#   ver pregunta abierta en DUDAS_PENDIENTES sobre nivel de detalle).

columns:

  - name: ID_BOM
    type: Text
    key: true
    label: false
    editable: false
    show: false
    formula: "CONCATENATE([COD_MOD], \"-\", [COD_MATERIAL])"
    description: "Clave compuesta Modelo-Material, autogenerada"

  - name: COD_MOD
    type: Ref
    ref_table: MODELOS_REF
    key: false
    label: true
    editable: true
    required: true
    show: true

  - name: COD_MATERIAL
    type: Ref
    ref_table: MATERIALES_REF
    key: false
    label: true
    editable: true
    required: true
    show: true

  - name: CANTIDAD_POR_UNIDAD
    type: Number
    key: false
    label: false
    editable: true
    required: true
    show: true
    description: "Cuánto de este material lleva UNA moto de este modelo"

  - name: CRITICO
    type: Yes/No
    key: false
    label: false
    editable: true
    required: false
    show: true
    description: "Si es TRUE, la falta de esta pieza bloquea/alerta el QC de recepción del contenedor"

data:
  # Cub 110 (1A) — motor, chasis, un neumático de muestra
  - COD_MOD: "1A"
    COD_MATERIAL: "CH01"
    CANTIDAD_POR_UNIDAD: 1
    CRITICO: true

  - COD_MOD: "1A"
    COD_MATERIAL: "MT01"
    CANTIDAD_POR_UNIDAD: 1
    CRITICO: true

  - COD_MOD: "1A"
    COD_MATERIAL: "NEU01"
    CANTIDAD_POR_UNIDAD: 2
    CRITICO: false

  - COD_MOD: "1A"
    COD_MATERIAL: "BAT01"
    CANTIDAD_POR_UNIDAD: 1
    CRITICO: true

  # Urban 110 (BA)
  - COD_MOD: "BA"
    COD_MATERIAL: "CH01"
    CANTIDAD_POR_UNIDAD: 1
    CRITICO: true

  - COD_MOD: "BA"
    COD_MATERIAL: "MT01"
    CANTIDAD_POR_UNIDAD: 1
    CRITICO: true

  - COD_MOD: "BA"
    COD_MATERIAL: "LLA01"
    CANTIDAD_POR_UNIDAD: 2
    CRITICO: false

  # VX125 (2B)
  - COD_MOD: "2B"
    COD_MATERIAL: "CH01"
    CANTIDAD_POR_UNIDAD: 1
    CRITICO: true

  - COD_MOD: "2B"
    COD_MATERIAL: "MT01"
    CANTIDAD_POR_UNIDAD: 1
    CRITICO: true

  - COD_MOD: "2B"
    COD_MATERIAL: "PIN01"
    CANTIDAD_POR_UNIDAD: 0.5
    CRITICO: false
