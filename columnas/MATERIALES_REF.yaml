# ============================================================
# TABLA DE REFERENCIA: MATERIALES_REF
# Usada para lookup, validación y stock desde DEPOSITO
# Esta tabla se edita solo para dar de alta nuevos materiales
# ============================================================

# Columnas de la hoja MATERIALES_REF en Google Sheets:
#   COD_MATERIAL | MATERIAL           | CATEGORIA        | UNIDAD | STOCK_MINIMO
#   -------------|--------------------|------------------|--------|--------------
#   CH01         | Chasis (partes)    | Partes de Chasis | UNIDAD | 20   ← confirmado
#   MT01         | Motor              | Motores          | UNIDAD | 20   ← confirmado
#   PLA01        | Plásticos (kit)    | Plásticos        | UNIDAD | 30   ← confirmado
#   VEN01        | Ventilador CKD     | Ventiladores CKD | UNIDAD | 20   ← confirmado
#   TOR01        | Tornillería        | Insumos          | KG     | 30   ← sin confirmar
#   NEU01        | Neumático          | Rodado           | UNIDAD | 40   ← sin confirmar
#   LLA01        | Llanta/Rin         | Rodado           | UNIDAD | 40   ← sin confirmar
#   BAT01        | Batería            | Eléctrico        | UNIDAD | 20   ← sin confirmar
#   CAB01        | Cableado           | Eléctrico        | METRO  | 200  ← sin confirmar
#   PIN01        | Pintura            | Pintura          | LITRO  | 50   ← sin confirmar
#   ASI01        | Asiento            | Carrocería       | UNIDAD | 20   ← sin confirmar
#   TAN01        | Tanque combustible | Carrocería       | UNIDAD | 20   ← sin confirmar
#
# ⚠ "Confirmado" = categoría mencionada por el cliente (motos CKD, 3
#   modelos: plásticos, motores, partes de chasis, ventiladores CKD).
#   El resto son ejemplos previos que se mantienen solo para no romper
#   BOM_REF — hay que confirmarlos o reemplazarlos, y todavía falta
#   armar el catálogo de bicicletas (~24 modelos, ver DUDAS_PENDIENTES).
#   Ya NO tiene columna UBICACION fija: la ubicación es rotativa (ver
#   tabla UBICACIONES y Deposito.UBICACION).

columns:

  - name: COD_MATERIAL
    type: Text
    key: true
    label: true

  - name: MATERIAL
    type: Text

  - name: CATEGORIA
    type: Text

  - name: UNIDAD
    type: Enum
    enum_values:
      - UNIDAD
      - KG
      - LITRO
      - METRO

  - name: STOCK_MINIMO
    type: Number
    description: "Umbral para la alerta de stock bajo (ver STOCK_ACTUAL / BAJO_MINIMO)"

  # ──────────────────────────────────────────────────────────
  # COLUMNAS VIRTUALES — calculan el stock a partir del historial
  # de movimientos en la tabla DEPOSITO (kardex)
  # ──────────────────────────────────────────────────────────

  - name: ULTIMA_UBICACION
    type: Text
    editable: false
    show: true
    formula: >
      LOOKUP(
        MAX(SELECT(Deposito[ID],
          AND(
            [COD_MATERIAL] = [_THISROW].[COD_MATERIAL],
            [TIPO_MOVIMIENTO] = "ENTRADA",
            [UBICACION] <> ""
          )
        )),
        "Deposito", "ID", "UBICACION"
      )
    description: >
      RESPUESTA CONFIRMADA (DUDAS_PENDIENTES #8): la ubicación en rack
      es ROTATIVA, no fija — se ocupa según se va liberando espacio.
      Por eso ya no hay un campo UBICACION fijo acá: cada movimiento
      de ENTRADA en Deposito registra dónde se colocó ESE ingreso
      (columna Deposito.UBICACION, validada contra la tabla
      UBICACIONES). Esta columna solo muestra la ubicación de la
      ENTRADA más reciente de este material — es orientativa, no una
      garantía de dónde está todo el stock actual (puede haber
      quedado repartido en más de un rack a la vez).

  - name: STOCK_ACTUAL
    type: Number
    editable: false
    show: true
    formula: >
      SUM(SELECT(Deposito[EFECTO_STOCK], [COD_MATERIAL] = [_THISROW].[COD_MATERIAL]))
    description: "Suma de entradas menos salidas/incompletos/intervenidos/reclamados registrados en Deposito"

  - name: BAJO_MINIMO
    type: Yes/No
    editable: false
    show: true
    formula: "[STOCK_ACTUAL] < [STOCK_MINIMO]"
    description: "Verdadero si el stock actual cayó por debajo del mínimo definido"

  # ──────────────────────────────────────────────────────────
  # COLUMNAS DEL "REPORTE MENSUAL" — formato estándar de depósito
  # (Saldo Inicial → Entradas → Salidas → Saldo Final del mes),
  # equivalente al Bin Card / Monthly Stock Report de logística.
  # ──────────────────────────────────────────────────────────

  - name: SALDO_INICIAL_MES
    type: Number
    editable: false
    show: true
    formula: >
      SUM(SELECT(Deposito[EFECTO_STOCK],
        AND(
          [COD_MATERIAL] = [_THISROW].[COD_MATERIAL],
          [FECHA] < STARTOFMONTH(TODAY())
        )
      ))
    description: "Stock acumulado hasta el último día del mes anterior (saldo con el que arrancó el mes actual)"

  - name: ENTRADAS_MES
    type: Number
    editable: false
    show: true
    formula: >
      SUM(SELECT(Deposito[CANTIDAD],
        AND(
          [COD_MATERIAL] = [_THISROW].[COD_MATERIAL],
          [ES_ESTE_MES] = TRUE,
          [TIPO_MOVIMIENTO] = "ENTRADA"
        )
      ))
    description: "Total ingresado (ENTRADA) en el mes actual"

  - name: SALIDAS_MES
    type: Number
    editable: false
    show: true
    formula: >
      SUM(SELECT(Deposito[CANTIDAD],
        AND(
          [COD_MATERIAL] = [_THISROW].[COD_MATERIAL],
          [ES_ESTE_MES] = TRUE,
          [TIPO_MOVIMIENTO] = "SALIDA"
        )
      ))
    description: "Total que salió (SALIDA) en el mes actual"

  - name: AJUSTES_MES
    type: Number
    editable: false
    show: true
    formula: >
      SUM(SELECT(Deposito[EFECTO_STOCK],
        AND(
          [COD_MATERIAL] = [_THISROW].[COD_MATERIAL],
          [ES_ESTE_MES] = TRUE,
          IN([TIPO_MOVIMIENTO], {"COMPLETO", "INCOMPLETO", "INTERVENIDO", "RECLAMADO"})
        )
      ))
    description: "Efecto neto de COMPLETO/INCOMPLETO/INTERVENIDO/RECLAMADO del mes (con signo)"

  - name: SALDO_FINAL_MES
    type: Number
    editable: false
    show: true
    formula: "[SALDO_INICIAL_MES] + [ENTRADAS_MES] - [SALIDAS_MES] + [AJUSTES_MES]"
    description: "Saldo Inicial + Entradas − Salidas + Ajustes = stock al día de hoy dentro del mes actual (coincide con STOCK_ACTUAL mientras el mes esté en curso)"

# ⚠ Categorías CONFIRMADAS por el cliente para motos CKD (3 modelos):
#   plásticos, motores, partes de chasis, ventiladores CKD.
#   Todavía no hay SKUs/códigos reales — estos son solo un ejemplo de
#   la ESTRUCTURA (una fila por pieza dentro de cada categoría) para
#   poder cargar el BOM real después. Bicicletas (~24 modelos) queda
#   pendiente de definir (ver DUDAS_PENDIENTES #13).

