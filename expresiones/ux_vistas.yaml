# ============================================================
# VISTAS Y UX - AppSheets
# Configurar en: UX → Views
# ============================================================

# Orden de navegación recomendado (barra inferior de la app):
# [ Registrar ] [ Hoy ] [ Buscar ] [ Dashboard ] [ Historial ]

vistas:

  # ──────────────────────────────────────────────────────────
  # 1. REGISTRAR (vista principal del operario)
  # ──────────────────────────────────────────────────────────
  - name: Registrar Moto
    tipo: Form
    tabla: Produccion
    posicion_nav: 1
    icono: add_circle
    descripcion: >
      Formulario de carga. El operario escanea el QR del chasis
      y solo ingresa NUM. MOTOR y COLOR.
    campos_visibles:
      - FECHA          # editable, valor inicial = hoy
      - CHASIS         # editable, scan=true (QR)
      - MODELO         # solo lectura, calculado automáticamente
      - CILINDRADA     # solo lectura, calculado automáticamente
      - RUEDA          # solo lectura, calculado automáticamente
      - COD MOD        # solo lectura, calculado automáticamente
      - COD MOTOR      # solo lectura, calculado automáticamente
      - NUM. MOTOR     # editable, required
      - COLOR          # editable, enum
      - OBS            # editable, opcional
    campos_ocultos:
      - ID
      - SEMANA
      - MES
      - AÑO
      - MES_LABEL
      - ES_HOY
      - ES_ESTA_SEMANA
      - ES_ESTE_MES

  # ──────────────────────────────────────────────────────────
  # 2. PRODUCCION DE HOY
  # ──────────────────────────────────────────────────────────
  - name: Hoy
    tipo: Table
    slice: Produccion_Hoy
    posicion_nav: 2
    icono: today
    sort_by:
      - columna: ID
        orden: Descending
    columnas_visibles:
      - ID
      - CHASIS
      - MODELO
      - COLOR
      - NUM. MOTOR
    header_formula: >
      CONCATENATE("Motos hoy: ", COUNTIF(Produccion[ES_HOY], TRUE))

  # ──────────────────────────────────────────────────────────
  # 3. BUSCAR (verificar chasis o motor existente)
  # ──────────────────────────────────────────────────────────
  - name: Buscar
    tipo: Table
    slice: Produccion_Todo
    posicion_nav: 3
    icono: search
    search_columns:
      - CHASIS
      - NUM. MOTOR
      - MODELO
    columnas_visibles:
      - FECHA
      - CHASIS
      - MODELO
      - NUM. MOTOR
      - COLOR

  # ──────────────────────────────────────────────────────────
  # 4. DASHBOARD (supervisor / gerencia)
  # ──────────────────────────────────────────────────────────
  - name: Dashboard
    tipo: Dashboard
    posicion_nav: 4
    icono: dashboard
    paneles:

      # Fila 1: KPIs en cards
      - tipo: card_kpi
        nombre: "Hoy"
        formula: "COUNTIF(Produccion[ES_HOY], TRUE)"
        color: "#1976D2"

      - tipo: card_kpi
        nombre: "Esta semana"
        formula: "COUNTIF(Produccion[ES_ESTA_SEMANA], TRUE)"
        color: "#388E3C"

      - tipo: card_kpi
        nombre: "Este mes"
        formula: "COUNTIF(Produccion[ES_ESTE_MES], TRUE)"
        color: "#F57C00"

      - tipo: card_kpi
        nombre: "Promedio/día"
        formula: "ROUND(COUNTIF(Produccion[ES_ESTE_MES], TRUE) / MAX(1, DAY(TODAY())), 1)"
        color: "#7B1FA2"

      - tipo: card_kpi
        nombre: "Total acumulado"
        formula: "COUNT(Produccion[CHASIS])"
        color: "#455A64"

      # Fila 2: Gráfico modelos de hoy
      - tipo: Bar Chart
        nombre: "Por Modelo — Hoy"
        slice: Produccion_Hoy
        eje_x: MODELO
        eje_y: COUNT
        group_by: MODELO
        orientacion: horizontal

      # Fila 3: Tendencia diaria del mes
      - tipo: Line Chart
        nombre: "Producción Diaria — Mes"
        slice: Produccion_Este_Mes
        eje_x: FECHA
        eje_y: COUNT
        group_by: FECHA

      # Fila 4: Color y Rueda del mes (lado a lado)
      - tipo: Pie Chart
        nombre: "Por Color — Mes"
        slice: Produccion_Este_Mes
        group_by: COLOR

      - tipo: Pie Chart
        nombre: "Aleación vs Rayos — Mes"
        slice: Produccion_Este_Mes
        group_by: RUEDA

      # Fila 5: Modelos × Color (barras apiladas)
      - tipo: Bar Chart
        nombre: "Modelo × Color — Mes"
        slice: Produccion_Este_Mes
        eje_x: MODELO
        series: COLOR
        stack: true

      # Fila 6: Producción semanal del año
      - tipo: Bar Chart
        nombre: "Producción Semanal — Año"
        slice: Produccion_Este_Anio
        eje_x: SEMANA
        eje_y: COUNT
        group_by: SEMANA

      # Fila 7: Histórico mensual
      - tipo: Bar Chart
        nombre: "Histórico Mensual"
        slice: Produccion_Todo
        eje_x: MES_LABEL
        eje_y: COUNT
        group_by: MES_LABEL

  # ──────────────────────────────────────────────────────────
  # 5. HISTORIAL COMPLETO
  # ──────────────────────────────────────────────────────────
  - name: Historial
    tipo: Table
    slice: Produccion_Todo
    posicion_nav: 5
    icono: history
    sort_by:
      - columna: FECHA
        orden: Descending
      - columna: ID
        orden: Descending
    columnas_visibles:
      - FECHA
      - ID
      - MODELO
      - CHASIS
      - NUM. MOTOR
      - COLOR
      - RUEDA

  # ──────────────────────────────────────────────────────────
  # 6. DETALLE (al tocar un registro en cualquier vista)
  # ──────────────────────────────────────────────────────────
  - name: Detalle Moto
    tipo: Detail
    tabla: Produccion
    posicion_nav: none   # solo se accede tocando un registro
    campos_visibles:
      - FECHA
      - ID
      - CHASIS
      - MODELO
      - CILINDRADA
      - NUM. MOTOR
      - COLOR
      - RUEDA
      - COD MOD
      - COD MOTOR
      - OBS
